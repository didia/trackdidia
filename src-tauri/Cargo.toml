[package]
name = "trackdidia"
version = "0.1.0"
description = "Trackdidia desktop app"
authors = ["Codex"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tokio = { version = "1", features = ["time", "rt-multi-thread", "net", "io-util", "sync"] }
urlencoding = "2"
# Rust-side sqlite pool pinned to a single physical connection that never gets reaped
# (max_connections(1) + min_connections(1) + idle_timeout(None) + max_lifetime(None), see
# db::build_pool_options), replacing tauri-plugin-sql: that plugin's pool has no options hook
# (bare Pool::connect(conn_url) in its wrapper.rs), so it cannot be pinned to one connection,
# which meant a BEGIN IMMEDIATE and its later COMMIT could land on different connections under
# concurrent db.select() calls. max_connections(1) alone would not fully fix that either: sqlx
# returns the connection to its idle queue after every statement and can close it there (its
# default max_lifetime/idle_timeout reapers), silently rolling back an open-but-idle transaction
# before the later COMMIT runs. See src/db.rs for the custom db_connect/db_execute/db_select
# commands that replace it.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
keyring = "3"
# Device id generation (src-tauri/src/device_id.rs); already in the lockfile transitively.
uuid = { version = "1", features = ["v4"] }
# Folder sync (src-tauri/src/sync_folder.rs): SHA-256 of published bundles and base64 transfer of
# bundle bytes over IPC. Both are already in the lockfile transitively at these versions.
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
tempfile = "3"

# O_NOFOLLOW / O_NONBLOCK differ per OS and architecture; used by sync_folder.rs to open files for
# reading without following a symlink. Already in the lockfile transitively.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# App Nap opt-out while a Pomodoro alarm is pending (see src/app_nap.rs); same versions tauri/wry
# already resolve to, so no new crates are pulled in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }
